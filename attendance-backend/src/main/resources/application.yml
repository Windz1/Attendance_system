server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: attendance-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/attendance_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  require-https: ${REQUIRE_HTTPS:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    window-minutes: ${LOGIN_WINDOW_MINUTES:15}
    lock-minutes: ${LOGIN_LOCK_MINUTES:15}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

attendance:
  timezone: Asia/Shanghai
  class-photo:
    root-dir: uploads/class-photos
    retention-days: 30
    cleanup-cron: "0 20 3 1 * ?"
