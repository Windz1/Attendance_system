server:
  port: 8080

spring:
  application:
    name: attendance-backend
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/attendance_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: rootroot
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

security:
  jwt:
    secret: <SECRET_KEY_FOR_ATTENDANCE_SYSTEM_CHANGE_ME_2026>
    expiration-minutes: 720
